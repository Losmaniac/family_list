<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e7ec9">
<meta name="description" content="Velká garáž – traktor, bagr, buldozer, americký truck, kombajn, domíchávač a rolba. Interaktivní hra pro nejmenší: klepni na stroj, rozjeď ho, rozsviť světla a zatrub.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Velká garáž – stroje pro nejmenší</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e7ec9'/%3E%3Ccircle cx='20' cy='44' r='11' fill='%23222'/%3E%3Ccircle cx='20' cy='44' r='5' fill='%23ffd21e'/%3E%3Ccircle cx='45' cy='47' r='8' fill='%23222'/%3E%3Ccircle cx='45' cy='47' r='3.5' fill='%23ffd21e'/%3E%3Cpath d='M14 34h16V20h14l8 12v10H14z' fill='%233aa14f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- sdílené přechody pro všechna SVG -->
<svg id="global-defs" width="0" height="0" aria-hidden="true" focusable="false"></svg>

<div class="app" id="app">

  <!-- ============================== GARÁŽ ============================== -->
  <section class="screen screen--garage is-visible" id="screen-garage">
    <header class="topbar">
      <h1 class="logo"><span class="logo__icon">🚜</span><span>Velká&nbsp;garáž</span></h1>
      <div class="topbar__tools">
        <button class="iconbtn" id="btn-sound" type="button" aria-pressed="true" title="Zvuk" aria-label="Zapnout nebo vypnout zvuk">
          <svg viewBox="0 0 24 24" class="i-sound-on" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" class="i-sound-off" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l6 5M22.5 9.5l-6 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <button class="iconbtn" id="btn-full" type="button" title="Celá obrazovka" aria-label="Celá obrazovka">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <p class="hint" id="hint">Klepni na stroj a hraj si!</p>

    <div class="garage" id="garage" role="list"></div>

    <footer class="garage__foot">
      <span>15 strojů · klikni a jeď 🚦</span>
    </footer>
  </section>

  <!-- ============================== HRA ================================ -->
  <section class="screen screen--play" id="screen-play">

    <header class="playbar">
      <button class="iconbtn iconbtn--big" id="btn-back" type="button" aria-label="Zpět do garáže">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="playbar__title">
        <span class="playbar__emoji" id="play-emoji">🚜</span>
        <span class="playbar__name" id="play-name">Traktor</span>
      </div>
      <div class="playbar__nav">
        <button class="iconbtn" id="btn-prev" type="button" aria-label="Předchozí stroj">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="iconbtn" id="btn-next" type="button" aria-label="Další stroj">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="iconbtn" id="btn-sound2" type="button" aria-pressed="true" aria-label="Zapnout nebo vypnout zvuk">
          <svg viewBox="0 0 24 24" class="i-sound-on" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" class="i-sound-off" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l6 5M22.5 9.5l-6 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="stage__sky" id="sky"></div>
      <div class="stage__sun" id="sun"></div>
      <div class="stage__layers" id="layers"></div>
      <div class="stage__polish" id="polish"></div>
      <div class="vehicle-wrap" id="vehicleWrap" role="button" tabindex="0" aria-label="Zatrub – klepni na stroj"></div>
      <canvas class="stage__fx" id="fx"></canvas>
      <div class="banner" id="banner" aria-live="polite"></div>
    </div>

    <nav class="controls" id="controls" aria-label="Ovládání stroje">
      <button class="ctrl ctrl--rev" data-act="rev" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5.5L4 12l7 6.5z"/><path d="M19 12h-6M19 7.5h-4M19 16.5h-4" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
        <span>Couvat</span>
      </button>
      <button class="ctrl ctrl--go" data-act="go" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5.5L20 12l-7 6.5z"/><path d="M5 12h6M5 7.5h4M5 16.5h4" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
        <span>Jeď</span>
      </button>
      <button class="ctrl ctrl--stop" data-act="stop" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>
        <span>Stůj</span>
      </button>
      <button class="ctrl ctrl--horn" data-act="horn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h3.2L12 18V6L6.2 10z"/><path d="M15.2 9.2a4 4 0 0 1 0 5.6M18 6.8a8 8 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>Houkat</span>
      </button>
      <button class="ctrl ctrl--lights" data-act="lights" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h5.5a5.5 5.5 0 0 1 0 11H3z"/><path d="M15.5 8h5M15.5 12h6M15.5 16h5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
        <span>Světla</span>
      </button>
      <button class="ctrl ctrl--action" data-act="action" type="button" id="btn-action">
        <span class="ctrl__icon" id="action-icon"></span>
        <span id="action-label">Kopat</span>
      </button>
    </nav>
  </section>
</div>

<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/particles.js"></script>
<script src="js/scenes.js"></script>
<script src="js/vehicles.js"></script>
<script src="js/app.js"></script>
</body>
</html>
